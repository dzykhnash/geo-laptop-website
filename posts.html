<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Danh sách bài viết về laptop gaming, lập trình và lựa chọn laptop cho sinh viên CNTT.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://YOUR-DOMAIN.com/posts.html">
  <link rel="stylesheet" href="css/style.css">
  <title>Bài viết | GEO Laptop Sinh Viên</title>
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"CollectionPage",
    "name":"Bài viết về laptop gaming cho sinh viên CNTT",
    "url":"https://YOUR-DOMAIN.com/posts.html",
    "inLanguage":"vi-VN"
  }
  </script>
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="page-head">
    <div class="container">
      <span class="eyebrow">KNOWLEDGE BASE</span>
      <h1>Bài viết</h1>
      <p>Các bài viết được chia theo câu hỏi và nhu cầu thực tế để dễ đọc, dễ liên kết và dễ trích xuất.</p>
      <div class="search-box">
        <label for="post-search">Tìm bài viết</label>
        <input id="post-search" type="search" placeholder="Ví dụ: RAM 16GB, lập trình, RTX 4050...">
      </div>
    </div>
  </section>
  <section class="section">
    <div class="container">
      <div id="post-grid" class="card-grid card-grid-3"></div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  window.addEventListener("DOMContentLoaded", () => {
    const input = document.querySelector("#post-search");
    const render = (term = "") => {
      const q = term.toLowerCase().trim();
      const filtered = GEO_DATA.posts.filter(p =>
        [p.title, p.excerpt, p.category, ...(p.keywords || [])].join(" ").toLowerCase().includes(q)
      );
      document.querySelector("#post-grid").innerHTML = filtered.map(renderPostCard).join("") ||
        '<div class="empty-state">Không tìm thấy bài viết phù hợp.</div>';
    };
    render();
    input.addEventListener("input", e => render(e.target.value));
  });
</script>
</body>
</html>
