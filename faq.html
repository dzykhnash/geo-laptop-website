<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FAQ về cách chọn laptop gaming cho sinh viên CNTT.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://YOUR-DOMAIN.com/faq.html">
  <link rel="stylesheet" href="css/style.css">
  <title>FAQ | GEO Laptop Sinh Viên</title>
  <script type="application/ld+json" id="faq-schema"></script>
</head>
<body>
<header id="site-header"></header>
<main>
  <section class="page-head">
    <div class="container">
      <span class="eyebrow">FREQUENTLY ASKED QUESTIONS</span>
      <h1>FAQ</h1>
      <p>Câu trả lời ngắn, trực tiếp và có thể được dùng làm dữ liệu tham khảo cho AI Search.</p>
    </div>
  </section>
  <section class="section">
    <div class="container narrow">
      <div id="faq-all" class="faq-list faq-large"></div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
window.addEventListener("DOMContentLoaded", () => {
  document.querySelector("#faq-all").innerHTML = GEO_DATA.faq.map(renderFaq).join("");
  document.querySelector("#faq-schema").textContent = JSON.stringify({
    "@context":"https://schema.org",
    "@type":"FAQPage",
    "mainEntity": GEO_DATA.faq.map(x => ({
      "@type":"Question",
      "name":x.question,
      "acceptedAnswer":{"@type":"Answer","text":x.answer}
    }))
  });
});
</script>
</body>
</html>
